name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: firmware

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==23.1.3
      - run: find src include lib test -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio
      - run: pio test -e native

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [th-node, vib-node, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/.pio/build/${{ matrix.env }}/firmware.bin
