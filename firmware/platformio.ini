; LoRa vibration & thermal monitoring — Heltec WiFi LoRa 32 V2 (915 MHz)
;
;   pio run -e th-node  -t upload    # temperature/humidity node (SHT31)
;   pio run -e vib-node -t upload    # vibration node (ADXL345)
;   pio run -e gateway  -t upload    # LoRa -> Wi-Fi/MQTT gateway with OLED
;   pio test -e native               # packet protocol unit tests
;
; Node ids are provisioned over serial (115200): SETID:<id> | GETID

[platformio]
default_envs = gateway

[heltec]
platform = espressif32@^6.9.0
framework = arduino
board = heltec_wifi_lora_32_V2
monitor_speed = 115200
build_flags = -Wall

[env:th-node]
extends = heltec
build_src_filter = -<*> +<th_node.cpp> +<node_common.cpp>
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit SHT31 Library@^2.2.2

[env:vib-node]
extends = heltec
build_src_filter = -<*> +<vib_node.cpp> +<node_common.cpp>
lib_deps =
    sandeepmistry/LoRa@^0.8.0

[env:gateway]
extends = heltec
build_src_filter = -<*> +<gateway.cpp>
build_flags = ${heltec.build_flags} -DMQTT_MAX_PACKET_SIZE=768
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    knolleary/PubSubClient@^2.8
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
